name: Validate managed storage
on:
  push:
    branches: ['feat/managed-postgres-migration']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timescale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
        env:
          TEST_MANAGED_POSTGRES: '1'
