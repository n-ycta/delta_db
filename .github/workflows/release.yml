name: Release plugin package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delta_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U delta_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://delta_test:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: tar --exclude='server/launch.mjs' -czf delta_db.tar.gz manifest.json package.json package-lock.json server LICENSE NOTICE migrations
      - run: sha256sum delta_db.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=v$(node -p "require('./package.json').version")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "delta_db $TAG" --notes "Verified plugin package for Delta 0.3. Node 22.12 or later required."
          gh release upload "$TAG" delta_db.tar.gz SHA256SUMS --clobber
